stages:
  - lint
  - build
  - scan
  - release

# Run a merge request pipeline while an MR is open, and a branch pipeline
# otherwise (e.g. main after merge). A bare `- when: always` catch-all would
# instead spawn a *detached* MR pipeline that silently omits every job gated on
# $CI_COMMIT_BRANCH (docker-build, semantic-release), so the build check would
# vanish from the MR. These rules also suppress the pointless pipeline for the
# vX.Y.Z tag semantic-release pushes — a tag matches none of them, so no pipeline
# is created (previously that tag pipeline ran trivy against a $CI_COMMIT_REF_SLUG
# image docker-build never built and failed with MANIFEST_UNKNOWN).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Suppress the duplicate branch pipeline when an MR is already open so a
    # commit isn't verified twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  TRIVY_SEVERITY: CRITICAL,HIGH

# Verification jobs opt in here so they run in both the merge request pipeline and
# branch pipelines. Jobs without explicit rules are omitted from MR pipelines, so
# every job that gates a change must reference this. semantic-release deliberately
# does not — it is main-branch-only (see its own rules).
.verify-rules: &verify-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

commitlint:
  stage: lint
  <<: *verify-rules
  image: node:24.18.1-trixie-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD
      elif git rev-parse --verify -q HEAD~1 >/dev/null; then
        npx commitlint --from HEAD~1 --to HEAD
      else
        # Repo's first commit has no parent, so HEAD~1 doesn't resolve — lint
        # just that commit by feeding its message to commitlint on stdin.
        git log -1 --pretty=%B | npx commitlint --verbose
      fi

hadolint:
  stage: lint
  <<: *verify-rules
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint --format codeclimate Dockerfile > hadolint-codequality.json
  artifacts:
    reports:
      codequality: hadolint-codequality.json
    when: always

trivy-dockerfile:
  stage: lint
  <<: *verify-rules
  image:
    name: aquasec/trivy:0.72.0
    entrypoint: [""]
  script:
    # Run 1: write Code Quality artifact. No --exit-code so the file is
    # guaranteed to exist before Run 2 can fail the job.
    - >
      trivy config
      --severity "$TRIVY_SEVERITY"
      --format template
      --template "@/contrib/gitlab-codequality.tpl"
      --output trivy-dockerfile-codequality.json
      Dockerfile
    # Run 2: enforce exit code. Output to stdout — no raw artifact needed.
    - trivy config --exit-code 1 --severity "$TRIVY_SEVERITY" Dockerfile
  artifacts:
    reports:
      codequality: trivy-dockerfile-codequality.json
    when: always

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

docker-build:
  stage: build
  <<: *verify-rules
  # The runners are rootless Podman and expose a Docker-compatible socket rather
  # than a Docker daemon — same setup the chainsaw job in idp-crossplane-compositions
  # relies on. We build with a remote Podman client against that socket; the old
  # docker:dind service + buildx docker-container driver has no daemon to reach.
  image: quay.io/podman/stable:v5.8.2
  variables:
    CONTAINER_HOST: unix:///run/podman/podman.sock
  script:
    - |
      # main pushes an immutable per-commit tag; branch/MR builds push a mutable
      # per-ref tag (CI_COMMIT_BRANCH is empty on MR pipelines, so it's the ref
      # slug). Those per-ref tags are ephemeral — the project's registry
      # tag-expiration policy keeps only v* release tags and expires the rest
      # after 7 days, so verifying the build in an MR leaves no lasting junk tag.
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      else
        TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
    # Podman emits a single-manifest image (no buildx attestation index), so the
    # GitLab digest-display issue that forced --provenance=false doesn't apply.
    - podman --remote build --tag "$TAG" .
    - podman --remote push --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "$TAG"

# ---------------------------------------------------------------------------
# Scan
# ---------------------------------------------------------------------------

trivy:
  stage: scan
  <<: *verify-rules
  image:
    name: aquasec/trivy:0.72.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      else
        IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
    # Run 1: write Code Quality artifact. No --exit-code so the file is
    # guaranteed to exist before Run 2 can fail the job.
    # --ignore-unfixed skips Debian CVEs with no patch available,
    # which would otherwise create permanent noise with no remediation path.
    - >
      trivy image
      --ignore-unfixed
      --severity "$TRIVY_SEVERITY"
      --format template
      --template "@/contrib/gitlab-codequality.tpl"
      --output trivy-codequality.json
      "$IMAGE"
    # Run 2: table output to stdout for readable CI logs, enforce exit code.
    # The vulnerability DB is already cached from Run 1.
    - >
      trivy image
      --exit-code 1
      --ignore-unfixed
      --severity "$TRIVY_SEVERITY"
      "$IMAGE"
  artifacts:
    reports:
      codequality: trivy-codequality.json
    when: always

# ---------------------------------------------------------------------------
# Release
# ---------------------------------------------------------------------------

semantic-release:
  stage: release
  # Retag is just pull/tag/push — no image build — so the Docker CLI driving the
  # rootless Podman socket (Docker-compatible API) is enough; no DinD service.
  image: quay.io/podman/stable:v5.8.2
  variables:
    CONTAINER_HOST: unix:///run/podman/podman.sock
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - dnf install -y --setopt=install_weak_deps=False nodejs npm git
  script:
    - npx --package semantic-release@25 --package @semantic-release/gitlab@13 semantic-release
  after_script:
    # Re-tag the image with the semver tag if a release was created.
    # semantic-release leaves the new tag in the local repo, so git describe
    # resolves it; skip the retag when no release happened.
    - |
      VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
      if [ -n "$VERSION" ]; then
        SRC="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        podman --remote pull --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "$SRC"
        # $VERSION is like v1.2.3. Also publish moving major (v1) and major.minor
        # (v1.2) tags so consumers can pin loosely; no latest by design.
        V="${VERSION#v}"; MAJOR="v${V%%.*}"; MINOR="v${V%.*}"
        for T in "$VERSION" "$MAJOR" "$MINOR"; do
          podman --remote tag "$SRC" "$CI_REGISTRY_IMAGE:$T"
          podman --remote push --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE:$T"
        done
      fi
